[versions]
# AGP 受 Gradle 版本上限约束：实测各版本 VersionCheckPlugin 内嵌的 GRADLE_MIN_VERSION
#   9.2.x -> 9.4.1 | 9.3.x -> 9.5.0 | 9.4.x -> 9.6.0
# 本仓库 Gradle wrapper 固定 9.4.1（不升），因此 AGP 最高只能用 9.2.x，取最新的 9.2.1。
agp = "9.2.1"
kotlin = "2.3.0"
androidxCore = "1.18.0"
androidCompileSdk = "37"
androidMinSdk = "24"
androidTargetSdk = "36"
androidxActivity = "1.13.0"
androidxComposeBom = "2026.09.00"
composeMultiplatform = "1.12.2"
# material3 的版本序列与主 Compose 不同：它只有 alpha（无稳定版），需与 1.12.x 主线上同代。
# 1.12.0-alpha03 声明要求 compose.ui 1.12.0-beta01，低于本仓库的 1.12.2，因此搭配自洽。
# 不可选 1.13.0-alpha02（它要求 compose.ui 1.13.0-alpha02）。
composeMaterial3 = "1.12.0-alpha03"
# com.android.tools:* 与 AGP 同套编号（AGP 9.x -> 32.x），须随 AGP 同步，避免错配。
androidTools = "32.2.1"
androidDesugarJdkLibs = "2.1.5"
koinBom = "4.2.2"
androidxLifecycle = "2.11.0"
ksp = "2.3.4"
protobufPlugin = "0.9.6"
androidxDatastore = "1.2.0"
confettikit = "0.9.0"
ktor = "3.6.0"
coil = "3.6.3"
cloudy = "0.4.0"
nav3Core = "1.1.0"
paging = "3.5.0"
deviceCompat = "2.0"
composeMultiplatformAdaptive = "1.3.0"
multiplatformNav3Ui = "1.1.1"
documentfile = "1.1.0"
ffmpegKitX6kb = "6.1.1"
appfunctions = "1.0.0-alpha07"
# Room：3.0.0 及以上会让 KSP 报 [MissingType]（KSP2 对 Room 实体类型解析的已知缺陷，
# 见 google/ksp#2026，以 stale 关闭未修复）。KSP 2.3.x 已移除 KSP1 实现
# （gradle 插件内仅剩 KspAA* 即 KSP2 的类，无 legacy），因此无法通过 ksp.useKSP2=false 规避。
# 结论：维持 3.0.0-alpha05 + sqlite 2.6.2 这一已验证可编译的组合，暂不升级。
# 若要再试，应等 KSP 修复该缺陷，或等 KSP 2.4.x 出现后再整体评估。
room3 = "3.0.0-alpha05"
sqlite = "2.6.2"
ksoup = "0.2.6"
# 本地二维码生成（替代原先依赖 pan.misakamoe.com 的云端出图服务）
# 1.3.1 要求 compose.ui 1.12.1，本仓库已升至 1.12.2，因此可以解除此前的 1.1.1 锁定。
# 已用 javap 核对 1.3.1 编译产物：QrCodePainter : CachedPainter、rememberQrCodePainter(data, options)、
# QrOptions(colors=)、QrColors(dark=,light=)、QrBrush.Default、QrBrush.solid 均与现有代码一致，无需改代码。
qrose = "1.3.1"
serializationJson = "1.11.0"
kotlinxDatetime = "0.8.0"
kotlinxIo = "0.9.1"
wire = "6.4.0"
# Testing
junit4 = "4.13.2"
androidxTest = "1.7.0"
androidxTestExtJunit = "1.3.0"
espresso = "3.7.0"
truth = "1.4.5"
coroutines = "1.11.0"
turbine = "1.2.1"
okio = "3.18.2"
kmpNativeCoroutines = "1.0.3"
# 注意：kmp-nativecoroutines 的 Gradle 插件会在构建脚本类路径上**钉住 kotlin-gradle-plugin**，
# 从而覆盖本目录里声明的 kotlin 版本。实测各版本要求：
#   1.0.0 -> KGP 2.3.0 | 1.0.1 -> 2.3.10 | 1.0.2 -> 2.3.20 | 1.0.3 -> 2.3.21
#   1.0.4 -> 2.4.0    | 1.0.5 -> 2.4.10  | 1.0.6 -> 2.4.20
# 因此这里必须停在 1.0.3：一旦升到 1.0.4+，实际 Kotlin 会被抬到 2.4.x，
# 而 KSP（2.3.4）是按 Kotlin 2.3.x 构建的，属于不受支持的组合。
# 升级本项前，务必先确认有与之匹配的 KSP 版本可用（截至目前 KSP 尚无 2.4.x）。
buildconfig = "6.0.9"

